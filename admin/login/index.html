<body class="admin-page">

<div class="admin-login-wrap" id="admin-main">

  <!-- Login Card -->
  <div class="admin-login-card card" id="admin-login-card" role="main" aria-label="Admin login">

    <div class="admin-login-header">
      <div class="admin-login-badge mono">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Admin Access</span>
      </div>
      <h1 class="admin-login-title">Sign in</h1>
      <p class="admin-login-sub">Restricted to authorized administrators only.</p>
    </div>

    <!-- Error banner -->
    <div id="login-error" class="feedback-banner feedback-banner--error" role="alert" aria-live="assertive" hidden>
      <div class="feedback-banner__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <p class="feedback-banner__msg" id="login-error-msg">Invalid credentials. Please try again.</p>
    </div>

    <form id="login-form" novalidate aria-label="Login form">

      <div class="form-group">
        <label for="login-email" class="form-label">Email address</label>
        <input
          type="email"
          id="login-email"
          name="email"
          class="admin-input"
          placeholder="admin@example.com"
          autocomplete="email"
          required
          aria-describedby="login-error"
        />
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Password</label>
        <div class="admin-input-wrap">
          <input
            type="password"
            id="login-password"
            name="password"
            class="admin-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            aria-describedby="login-error"
          />
          <button type="button" class="admin-input-toggle" id="toggle-password" aria-label="Toggle password visibility">
            <svg id="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--lg admin-login-btn" id="login-submit-btn">
        <span class="btn-spinner" aria-hidden="true"></span>
        <span class="btn-label">Sign in</span>
      </button>

    </form>

    <p class="admin-login-note">
      Access is restricted. Contact the site owner to request access.
    </p>

  </div>
</div>
